[project]
name = "citadel"
version = "3.0.0"
description = "System zarządzania finansami, strukturą organizacyjną i ratingiem wiarygodności Celestia"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Citadel Team" }
]
dependencies = [
    "streamlit>=1.35.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0,<17.0.0",
    "plotly>=5.20.0",
    "psycopg[binary,pool]>=3.1.18",
    "python-dateutil>=2.9.0",
    "openpyxl>=3.1.2",
    "watchdog>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["citadel"]

